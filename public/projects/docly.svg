<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <radialGradient id="glowA" cx="18%" cy="10%" r="65%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="95%" cy="100%" r="60%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="750" fill="#07051a"/>
  <rect width="1200" height="750" fill="url(#glowA)"/>
  <rect width="1200" height="750" fill="url(#glowB)"/>

  <!-- App window -->
  <g filter="url(#shadow)">
    <rect x="60" y="56" width="1080" height="640" rx="18" fill="#0e0b24" stroke="#2a2457"/>
  </g>
  <!-- Title bar -->
  <path d="M60 74a18 18 0 0 1 18-18h1044a18 18 0 0 1 18 18v26H60z" fill="#141033"/>
  <circle cx="88" cy="78" r="6" fill="#ff5f57"/>
  <circle cx="108" cy="78" r="6" fill="#febc2e"/>
  <circle cx="128" cy="78" r="6" fill="#28c840"/>
  <rect x="470" y="68" width="260" height="20" rx="10" fill="#0b0920" stroke="#2a2457"/>
  <text x="600" y="82" text-anchor="middle" font-size="11" fill="#8f8bb8">docly-ai.vercel.app</text>

  <!-- Sidebar -->
  <path d="M60 678v0a18 18 0 0 0 18 18h252V100H60z" fill="#110d2b"/>
  <g>
    <rect x="84" y="122" width="34" height="34" rx="9" fill="url(#brand)"/>
    <path d="M94 132h10l6 6v10a2 2 0 0 1-2 2H94a2 2 0 0 1-2-2v-14a2 2 0 0 1 2-2z" fill="#fff" opacity="0.95"/>
    <text x="130" y="145" font-size="20" font-weight="700" fill="#fff">Docly</text>
  </g>

  <rect x="84" y="176" width="222" height="40" rx="10" fill="url(#userBubble)"/>
  <text x="195" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">+  Upload documents</text>

  <text x="84" y="248" font-size="11" font-weight="600" letter-spacing="1.5" fill="#7c76a8">YOUR DOCUMENTS</text>

  <!-- Doc 1 (selected) -->
  <rect x="76" y="262" width="238" height="58" rx="10" fill="#1f1946" stroke="#4c3d8f"/>
  <rect x="90" y="274" width="26" height="32" rx="4" fill="#ef4444"/>
  <text x="103" y="295" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">PDF</text>
  <text x="126" y="287" font-size="13" font-weight="600" fill="#ece9ff">Master Services Agre…</text>
  <circle cx="131" cy="303" r="4" fill="#22c55e"/>
  <text x="140" y="307" font-size="11" fill="#86efac">Ready · 48 pages</text>

  <!-- Doc 2 -->
  <rect x="90" y="338" width="26" height="32" rx="4" fill="#3b82f6"/>
  <text x="103" y="359" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">DOC</text>
  <text x="126" y="351" font-size="13" fill="#c9c5ea">Q3 Financial Report</text>
  <circle cx="131" cy="367" r="4" fill="#22c55e"/>
  <text x="140" y="371" font-size="11" fill="#86efac">Ready · 22 pages</text>

  <!-- Doc 3 (processing) -->
  <rect x="90" y="394" width="26" height="32" rx="4" fill="#ef4444"/>
  <text x="103" y="415" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">PDF</text>
  <text x="126" y="407" font-size="13" fill="#c9c5ea">Vendor Contract 2026</text>
  <text x="126" y="425" font-size="11" fill="#c4b5fd">Embedding… 68%</text>
  <rect x="126" y="432" width="170" height="5" rx="2.5" fill="#2a2457"/>
  <rect x="126" y="432" width="116" height="5" rx="2.5" fill="url(#brand)"/>

  <!-- Doc 4 (queued) -->
  <rect x="90" y="456" width="26" height="32" rx="4" fill="#ef4444" opacity="0.6"/>
  <text x="103" y="477" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">PDF</text>
  <text x="126" y="469" font-size="13" fill="#8f8bb8">Employee Handbook</text>
  <text x="126" y="487" font-size="11" fill="#7c76a8">Queued</text>

  <!-- Pipeline footer -->
  <rect x="84" y="606" width="222" height="68" rx="12" fill="#0b0920" stroke="#2a2457"/>
  <text x="98" y="628" font-size="10" font-weight="600" letter-spacing="1.2" fill="#7c76a8">INGESTION</text>
  <g font-size="10.5" fill="#c9c5ea">
    <rect x="98" y="640" width="44" height="20" rx="6" fill="#1f1946"/><text x="120" y="654" text-anchor="middle">S3</text>
    <text x="149" y="654" fill="#6d5bd0">→</text>
    <rect x="160" y="640" width="58" height="20" rx="6" fill="#1f1946"/><text x="189" y="654" text-anchor="middle">BullMQ</text>
    <text x="225" y="654" fill="#6d5bd0">→</text>
    <rect x="236" y="640" width="56" height="20" rx="6" fill="#1f1946"/><text x="264" y="654" text-anchor="middle">Vectors</text>
  </g>

  <!-- Chat header -->
  <text x="362" y="138" font-size="17" font-weight="600" fill="#fff">Master Services Agreement</text>
  <text x="362" y="160" font-size="12" fill="#8f8bb8">Answers grounded in your document · 1536-dim embeddings</text>
  <line x1="350" y1="180" x2="820" y2="180" stroke="#231d4d"/>

  <!-- User message -->
  <rect x="512" y="204" width="290" height="62" rx="16" fill="url(#userBubble)"/>
  <text x="530" y="230" font-size="14" fill="#fff">What's the notice period for</text>
  <text x="530" y="250" font-size="14" fill="#fff">terminating this agreement?</text>

  <!-- Assistant message -->
  <rect x="362" y="290" width="22" height="22" rx="6" fill="url(#brand)"/>
  <path d="M368 297h6l4 4v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z" fill="#fff"/>
  <rect x="394" y="288" width="410" height="176" rx="16" fill="#18133a" stroke="#2f2763"/>
  <g font-size="14" fill="#e5e2ff">
    <text x="412" y="316">Either party may terminate with <tspan font-weight="700" fill="#fff">60 days'</tspan></text>
    <text x="412" y="337">written notice <tspan fill="#a78bfa">[1]</tspan>. Termination for material</text>
    <text x="412" y="358">breach requires <tspan font-weight="700" fill="#fff">30 days</tspan> to cure after notice</text>
    <text x="412" y="379"><tspan fill="#a78bfa">[2]</tspan>.</text>
  </g>
  <g font-size="11.5">
    <rect x="412" y="398" width="132" height="26" rx="13" fill="#241c55" stroke="#4c3d8f"/>
    <text x="478" y="415" text-anchor="middle" fill="#c4b5fd">[1] §14.2 · p. 31</text>
    <rect x="554" y="398" width="132" height="26" rx="13" fill="#241c55" stroke="#4c3d8f"/>
    <text x="620" y="415" text-anchor="middle" fill="#c4b5fd">[2] §14.4 · p. 32</text>
  </g>
  <text x="412" y="448" font-size="11" fill="#7c76a8">Grounded in 2 sources from this document</text>

  <!-- Composer -->
  <rect x="362" y="610" width="442" height="54" rx="14" fill="#0b0920" stroke="#2f2763"/>
  <text x="384" y="642" font-size="14" fill="#6f6a99">Ask a follow-up question…</text>
  <rect x="756" y="620" width="36" height="34" rx="10" fill="url(#userBubble)"/>
  <path d="M766 637l16-7-5 16-3-6z" fill="#fff"/>

  <!-- Source panel -->
  <rect x="836" y="124" width="280" height="540" rx="14" fill="#f8f7ff"/>
  <text x="856" y="152" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6d5bd0">SOURCE · PAGE 31</text>
  <text x="856" y="182" font-size="15" font-weight="700" fill="#1e1b3a">14. Term and Termination</text>
  <g fill="#cfcbe6">
    <rect x="856" y="200" width="236" height="7" rx="3.5"/>
    <rect x="856" y="216" width="214" height="7" rx="3.5"/>
    <rect x="856" y="232" width="226" height="7" rx="3.5"/>
  </g>
  <text x="856" y="270" font-size="12.5" font-weight="700" fill="#1e1b3a">14.2 Termination for convenience</text>
  <rect x="850" y="282" width="252" height="74" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <g font-size="12" fill="#2e2a52">
    <text x="860" y="302">Either party may terminate this</text>
    <text x="860" y="320">Agreement upon sixty (60) days'</text>
    <text x="860" y="338">prior written notice to the other.</text>
  </g>
  <g fill="#cfcbe6">
    <rect x="856" y="374" width="230" height="7" rx="3.5"/>
    <rect x="856" y="390" width="200" height="7" rx="3.5"/>
  </g>
  <text x="856" y="428" font-size="12.5" font-weight="700" fill="#1e1b3a">14.4 Material breach</text>
  <rect x="850" y="440" width="252" height="56" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <g font-size="12" fill="#2e2a52">
    <text x="860" y="460">…shall have thirty (30) days to</text>
    <text x="860" y="478">cure following written notice.</text>
  </g>
  <g fill="#cfcbe6">
    <rect x="856" y="516" width="236" height="7" rx="3.5"/>
    <rect x="856" y="532" width="218" height="7" rx="3.5"/>
    <rect x="856" y="548" width="228" height="7" rx="3.5"/>
    <rect x="856" y="564" width="160" height="7" rx="3.5"/>
  </g>
  <rect x="856" y="606" width="240" height="38" rx="10" fill="#1e1b3a"/>
  <text x="976" y="630" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Open full document</text>
</svg>
